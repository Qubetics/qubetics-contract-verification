name: '[prod] Deploy contract verification'

on: 
  push:
    branches: 
      - prod

jobs:
  deploy_testnet_contract_verification:
    uses: ./.github/workflows/qubetics-contract-verification.yaml
    with:
      SWR_ORGANIZATION: prod-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: 'ap-southeast-1'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Contract-verification/contract-verification-deployment.yaml
      HUAWEI_IMAGE: prod-qubetics-contract-verifications
      DOCKER_USERNAME: ap-southeast-1@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.contract-verification-secret }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
