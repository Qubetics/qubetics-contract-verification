name: '[dev] Deploy explorer frontend'

on: 
  push:
    branches: 
      - dev

jobs:
  dev_deploy_explorer_frontend:
    uses: ./.github/workflows/qubetics-contract-verification.yaml
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Contract-verification/contract-verification.yaml
      HUAWEI_IMAGE: dev-contract-verification
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.DEV_CONTRACT_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
