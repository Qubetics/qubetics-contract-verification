name: '[testnet] Deploy testnet contract verification'

on: 
  push:
    branches: 
      - testnet

jobs:
  deploy_testnet_contract_verification:
    uses: ./.github/workflows/qubetics-contract-verification.yaml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnet
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Contract-verification/contract-verification.yaml
      HUAWEI_IMAGE: testnet-contract-verification
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.TESTNET_CONTRACT_VERIFICATION_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
